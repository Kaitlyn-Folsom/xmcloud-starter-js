# Client Brand Theme — PSEG / PSE&G
# Extracted from: https://nj.pseg.com/
# Primary source: user-provided homepage screenshot (screenshot-source.png)
# Playwright scraper redirected to worryfree.pseg.com — those tokens were not used.

client:
  name: "PSEG"
  sourceUrl: "https://nj.pseg.com/"
  extractedAt: "2026-08-17T22:05:00Z"
  extractedBy: "cursor"

colors:
  primary: "#1b3054"
  primaryForeground: "#ffffff"
  secondary: "#1b2a44"
  secondaryForeground: "#ffffff"
  accent: "#f37022"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#231f20"
  muted: "#f2f4f6"
  mutedForeground: "#5a6573"
  headerBackground: "#ffffff"
  headerForeground: "#1b3054"
  footerBackground: "#1b2a44"
  footerForeground: "#ffffff"
  border: "#d6dce2"
  ring: "#1b3054"
  extra:
    - { name: "utilityBar", value: "#1b2a44" }
    - { name: "heroNavy", value: "#1b3054" }
    - { name: "tabActive", value: "#1b3054" }
    - { name: "linkBlue", value: "#0066a1" }
    - { name: "emergency", value: "#c1531a" }

typography:
  headingFamily: "'Open Sans', Arial, Helvetica, sans-serif"
  headingWeight: "700"
  bodyFamily: "'Open Sans', Arial, Helvetica, sans-serif"
  bodyWeight: "400"
  monoFamily: "'Roboto Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
  scale:
    hero: "2.25rem"
    h1: "2rem"
    h2: "1.5rem"
    h3: "1.25rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "normal"
  sectionGap: "0"
  containerMaxWidth: "1200px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0.25rem"
  buttonRadius: "0.125rem"
  cardRadius: "0"
  imageRadius: "0"
  shadowStyle: "none"
  borderStyle: "subtle"

tone:
  overall: "corporate"
  colorMode: "mixed"
  contrast: "high"
  imagery: "photography"
  heroStyle: "gradient"
  cardStyle: "bordered"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#1b3054"
      secondary: "#1b2a44"
      accent: "#f37022"
  fontFamily:
    heading: ["Open Sans", "Arial", "Helvetica", "sans-serif"]
    body: ["Open Sans", "Arial", "Helvetica", "sans-serif"]
  borderRadius:
    DEFAULT: "0.25rem"
    button: "0.125rem"
    card: "0"

cssVariables: |
  :root {
    --brand-primary: #1b3054;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #1b2a44;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #f37022;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #231f20;
    --brand-muted: #f2f4f6;
    --brand-muted-fg: #5a6573;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #1b3054;
    --brand-footer-bg: #1b2a44;
    --brand-footer-fg: #ffffff;
    --brand-border: #d6dce2;
    --brand-ring: #1b3054;
    --brand-heading-font: 'Open Sans', Arial, Helvetica, sans-serif;
    --brand-body-font: 'Open Sans', Arial, Helvetica, sans-serif;
    --brand-radius: 0.25rem;
    --brand-button-radius: 0.125rem;
    --brand-card-radius: 0;
  }

extraction:
  confidence: "high"
  method: "screenshot-primary"
  notes:
    - "User screenshot of nj.pseg.com is the source of truth for layout, colors, and tone."
    - "Playwright followed a redirect to worryfree.pseg.com (Outfit + DM Serif). Those tokens were discarded."
    - "Utility bar is dark navy (#1b2a44). Main header is white with navy text and orange logo mark."
    - "Hero is a dark navy band with white headline, J.D. Power trophy, and a login module — not a photo hero."
    - "Cards are flat white rectangles with light gray borders, not elevated shadows."
    - "Buttons are nearly square (very small radius), navy fill or outlined."
    - "Accent orange (#f37022) is used for the logo mark and sparingly for emphasis, not as the primary button color."
    - "Sections are full-width horizontal bands that alternate white / light gray / dark navy."
    - "Existing pseg-ai site-pseg tokens already match this palette and will be aligned in Phase 4."
