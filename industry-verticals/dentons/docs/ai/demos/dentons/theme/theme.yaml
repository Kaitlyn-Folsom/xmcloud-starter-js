  sectionGap: ""
  containerMaxWidth: "1170px"
  containerPadding: ""

shape:
  borderRadius: "8px"
  buttonRadius: "30px"
  cardRadius: "8px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "none"

tone:
  overall: "Global law firm. Dark header, purple actions, photographic heroes, light card grids."
  colorMode: "light"
  contrast: "high on the black header and purple buttons"
  imagery: "Full-bleed photography in the hero and on cards"
  heroStyle: "Left-aligned headline on a photo, pill button, tile row underneath"
  cardStyle: "Image on top, eyebrow, title, short text, purple pill button, on a light gray card"
  navStyle: "Black bar, purple wordmark, four text links, language pill, search, hamburger"

siteThemeScss: |
  body.site-dentons, .site-dentons {
    --text-body: #545859;
    --text-body-inverted: #ffffff;
    --text-colored: #702082;
    --text-footer: #545859;
    --text-accent: #702082;
    --bg-body: #ffffff;
    --bg-footer: #efefef;
    --bg-main: #ffffff;
    --bg-main-alt: #efefef;
    --bg-color: #f6f0f8;
    --bg-saturated: #702082;
    --bg-accent: #702082;
    --border-color: #efefef;
    --hr-color: #efefef;
    --roundness: 30px;
  }
  body.site-dentons.dark, .dark .site-dentons {
    --text-body: #f0f0f0;
    --text-body-inverted: #1a1a1a;
    --text-colored: #d7a4e6;
    --text-footer: #f0f0f0;
    --text-accent: #d7a4e6;
    --bg-body: #1a1a1a;
    --bg-footer: #111111;
    --bg-main: #1a1a1a;
    --bg-main-alt: #2a2a2a;
    --bg-color: #2a2030;
    --bg-saturated: #702082;
    --bg-accent: #702082;
    --border-color: #3a3a3a;
    --hr-color: #3a3a3a;
    --roundness: 30px;
