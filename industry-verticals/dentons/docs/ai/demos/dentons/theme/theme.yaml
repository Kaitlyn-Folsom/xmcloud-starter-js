extraction:
  confidence: "medium"
  method: "Playwright scrape of https://www.dentons.com/en, plus header-styles and section-capture"
  notes:
    - "Dentons Sans is a proprietary webfont. Source Sans 3 is the Google Fonts substitute."
    - "Button fill #702082 and radius 30px come from section-capture. The scraper sampled a nearby purple #71298e and a 0px radius."
    - "Header band is #000000, 102px (header-styles). The crop shows light nav labels. header-styles recorded nav color #4c4c4c; that hex does not match the crop. The theme uses white header text from the crop."
    - "A cookie dialog covered several section crops. Colours above are from computed styles, not from the dialog."
