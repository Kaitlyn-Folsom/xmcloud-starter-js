# Client Brand Theme — Dentons
# Measured from https://www.dentons.com/en/ on 2026-10-26.

client:
  name: "Dentons"
  sourceUrl: "https://www.dentons.com/en/"
  extractedAt: "2026-10-26T18:48:22Z"
  extractedBy: "site-scraper.mjs plus section crops"

colors:
  primary: "#702082"
  primaryForeground: "#FFFFFF"
  secondary: "#545859"
  secondaryForeground: "#FFFFFF"
  accent: "#702082"
  accentForeground: "#FFFFFF"
  background: "#FFFFFF"
  foreground: "#545859"
  muted: "#EFEFEF"
  mutedForeground: "#666666"
  headerBackground: "#FFFFFF"
  headerForeground: "#4C4C4C"
  footerBackground: "#EFEFEF"
  footerForeground: "#545859"
  border: "#E5E5E5"
  ring: "#702082"
  extra:
    - { name: "button", value: "#702082" }
    - { name: "help-band", value: "#333333" }

typography:
  headingFamily: "Dentons Sans"
  headingWeight: "600"
  bodyFamily: "Dentons Sans"
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
  scale:
    hero: "35px"
    h1: "35px"
    h2: "30px"
    h3: "18px"
    body: "16px"
    small: "14px"
  headingTransform: "none"
  letterSpacing: "0"
  lineHeight: "1.5"

spacing:
  density: "comfortable"
  sectionGap: "large"
  containerMaxWidth: "1170px"
  containerPadding: "30px"

shape:
  borderRadius: "8px"
  buttonRadius: "30px"
  cardRadius: "8px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "none"

tone:
  overall: "Global law firm. Formal, spacious, purple on white."
  colorMode: "light"
  contrast: "high"
  imagery: "Full-bleed photography on the hero and on insight cards."
  heroStyle: "Full-bleed carousel with a headline, one pill button, and four topic tiles on the lower edge."
  cardStyle: "Image, eyebrow, title, excerpt, purple pill button."
  navStyle: "White bar, purple logo, four text links, language, search, and a hamburger."

siteThemeScss: |
  body.site-dentons, .site-dentons {
    --text-body: #545859;
    --text-body-inverted: #ffffff;
    --text-colored: #702082;
    --text-footer: #545859;
    --text-accent: #702082;
    --bg-body: #ffffff;
    --bg-footer: #efefef;
    --bg-main: #ffffff;
    --bg-main-alt: #efefef;
    --bg-color: #f6f0f8;
    --bg-saturated: #702082;
    --bg-accent: #702082;
    --border-color: #e5e5e5;
    --hr-color: #e5e5e5;
    --roundness: 30px;
  }
  body.site-dentons.dark, .dark .site-dentons {
    --text-body: #f0f0f0;
    --text-body-inverted: #1a1a1a;
    --text-colored: #d7a4e8;
    --text-footer: #f0f0f0;
    --text-accent: #d7a4e8;
    --bg-body: #1a1a1a;
    --bg-footer: #111111;
    --bg-main: #242424;
    --bg-main-alt: #2c2c2c;
    --bg-color: #3a2344;
    --bg-saturated: #702082;
    --bg-accent: #702082;
    --border-color: #3a3a3a;
    --hr-color: #3a3a3a;
    --roundness: 30px;
  }

extraction:
  confidence: "medium"
  method: "site-scraper.mjs computed styles, sections.json button and heading colors, and the desktop screenshot"
  notes:
    - "Dentons Sans is proprietary. Source Sans 3 is the Google Fonts substitute."
    - "header-styles.json reports the header band as #000000. The scraper and the header crop show a white bar. The theme uses white."
    - "Button purple #702082 is from sections.json. The scraper sampled a nearby purple #71298e."
