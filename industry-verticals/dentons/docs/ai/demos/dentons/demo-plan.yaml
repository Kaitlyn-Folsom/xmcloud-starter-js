# Dentons. Collection and template are filled from the SE's answer before approval.
userApproved: true
approvedAt: "2026-10-21T20:39:57.000Z"

client:
  name: "Dentons"
  kebab: "dentons"
  sourceUrl: "https://www.dentons.com/en"

story:
  situation: "Dentons will score a product demo on the October 2026 demo spec: about 90 minutes, seven live scenarios in a fixed order, heaviest on authoring and global experience management. Shane and Carly are the attendees named in the supporting brief. The site is the public English site, so each scenario is shown there when the public site can show it."
  audiences:
    - id: a1
      name: "Shane, GBT decision-maker (named in the opportunity brief, not in the spec)"
      annoyance: "Every scenario has to say what is core licence, an add-on, a third party, custom or roadmap"
      afterward: "He can score hosting, search, analytics and personalization without a feature being implied"
    - id: a2
      name: "Carly, content owner (named in the opportunity brief, not in the spec)"
      annoyance: "Authors need regional publishing with central governance, and help that a person still approves"
      afterward: "She can see the published global pages and know which authoring steps happen in Pages"
  chainOfPain:
    - id: c1
      issue: "Authoring and publishing across a global, multi-site, multi-language, multi-brand estate"
      owners: [a2, a1]
      reason: "Regions need autonomy while central governance, reuse, taxonomy, reference data and brand consistency stay in place. Spec weight 25 percent, and it is the first live scenario."
      evidence: "Show how the platform supports authoring and publishing across a global, multi-site, multi-language and multi-brand estate. (spec §4.1.1)"
      evidenceType: rfp
      impact: "not given"
    - id: c2
      issue: "Images, documents and other media have to be managed and reused across sites and channels"
      owners: [a1]
      reason: "The spec asks for the asset capabilities that matter, and a clear line between native DAM and a separate product."
      evidence: "Distinguish native functionality from a separately licensed DAM product or third-party service. (spec §4.1.2)"
      evidenceType: rfp
      impact: "not given"
    - id: c3
      issue: "Authors need practical AI help with a person still reviewing"
      owners: [a2]
      reason: "The spec asks for creation, metadata, taxonomy, translation or workflow, plus human approval and a line between included use and extra consumption."
      evidence: "Demonstrate human review and approval, brand or knowledge grounding, controls, and auditability. (spec §4.1.3)"
      evidenceType: rfp
      impact: "not given"
    - id: c4
      issue: "Visitors need to find lawyers, expertise, locations and content"
      owners: [a1, a2]
      reason: "The spec asks for conventional search through semantic or generated answers, and what is production-ready today."
      evidence: "Show how the platform supports visitors in finding and discovering relevant lawyers, expertise, locations and content. (spec §4.1.4)"
      evidenceType: rfp
      impact: "not given"
    - id: c5
      issue: "Content has to stay discoverable for SEO and AEO, under governance"
      owners: [a2]
      reason: "The spec asks for author and administrator support. It does not require Dentons-specific SEO designs."
      evidence: "Dentons-specific designs or completed SEO/AEO recommendations are not required. (spec §4.1.5)"
      evidenceType: rfp
      impact: "not given"
    - id: c6
      issue: "Authors and marketers need a native view of performance, search insight and experiment results"
      owners: [a1]
      reason: "The spec asks what feeds enterprise reporting and what needs an external analytics implementation."
      evidence: "Show the native author and marketing view of site and content performance, search insight, and experimentation or personalization results where available. (spec §4.1.6)"
      evidenceType: rfp
      impact: "not given"
    - id: c7
      issue: "Personalized experiences have to be created and governed by a business user"
      owners: [a1, a2]
      reason: "The spec asks for a path from geography and anonymous behaviour to audience experiences, with results and a fallback. The SE first said not to add personalization."
      evidence: "Show how a business user creates and governs a personalized experience or experiment, views results, and controls fallback or default content. (spec §4.1.7)"
      evidenceType: rfp
      impact: "not given"
  messageMap:
    before: "The demo spec says the RFI showed several platforms could support the modernization. The demonstration now has to prove practical fit on seven scenarios, in one order, on a global professional-services site."
    requiredCapabilities:
      - "Author and publish across sites, languages and brands with governance"
      - "Manage and reuse media, and say what is a separate DAM"
      - "Give authors AI help with human review"
      - "Help visitors find lawyers, expertise, locations and content"
      - "Keep content discoverable for SEO and AEO"
      - "Show performance and search insight to authors and marketers"
      - "Let a business user govern personalization and its fallback"
    after: "A scored walkthrough in the spec's order. The public site carries the visitor half. Authoring, DAM, AI operations, SEO controls, analytics and personalization rules are named where they are not pages on dentons.com."
    metrics: ["Spec weights: authoring 25%, AI operations 10%, search 10%, personalization 10%, analytics 8%, DAM 7%, SEO/AEO 5%"]
    differentiators: ["The spec requires each scenario to say core licence, add-on, third party, custom or roadmap"]
    proofPoints: ["none in the demo spec"]
    whyNow: "The October/November 2026 spec is the evaluation script for the product demonstration."
  moments:
    - id: m1
      title: "Authoring, workflow and global experience management"
      wow: true
      cbi: [c1]
      audience: [a2, a1]
      annoyance: "Regions need to publish without losing central governance"
      afterward: "A published global sector page stays on brand"
      capability: "Authoring and publishing across a multi-site estate"
      mustSee: "Home, then Global sectors, the published result. The editor is Pages and is not a page on this site."
      clickPath: ["/Home", "/Home/global-sectors"]
      checkIn: "Is this the global experience you want regions to publish into?"
    - id: m2
      title: "Digital asset management"
      wow: false
      cbi: [c2]
      audience: [a1]
      annoyance: "Media has to be reused, and native DAM has to be separated from a separate licence"
      afterward: "The same photography appears across the homepage bands"
      capability: "Reuse of images on the published site"
      mustSee: "Homepage hero and cards. DAM administration is not a public page."
      clickPath: ["/Home"]
      checkIn: "Where do you still need the DAM product conversation, beyond these published images?"
    - id: m3
      title: "AI-assisted content operations"
      wow: false
      cbi: [c3]
      audience: [a2]
      annoyance: "Authors need help creating and tagging, with a person still approving"
      afterward: "Knowledge opens a published article. The AI steps are not on the public site."
      capability: "AI assistance for authors, with human review"
      mustSee: "Knowledge, then one published article. Creation, metadata, translation and approval are a Pages conversation."
      clickPath: ["/Home", "/Home/insights", "/Home/insights/balancing-innovation-and-competition"]
      checkIn: "Which of these AI steps do you need to see in Pages?"
    - id: m4
      title: "Search, expertise discovery and AI answers"
      wow: false
      cbi: [c4]
      audience: [a1, a2]
      annoyance: "Visitors cannot rely on a single way to find a lawyer, an office or a piece of content"
      afterward: "People search opens a lawyer profile"
      capability: "Conventional discovery on the live site"
      mustSee: "Header search, then Our people, then Martin Abadi. Generated AI answers are not on the live site and are not added."
      clickPath: ["/Home", "/Home/our-professionals", "/Home/our-professionals/martin-abadi"]
      checkIn: "Is people search enough for this scenario, or do you need generated answers called out as not on this site?"
    - id: m5
      title: "SEO, AEO and content discoverability"
      wow: false
      cbi: [c5]
      audience: [a2]
      annoyance: "Published content has to be findable, and authors need governed controls"
      afterward: "A published program page is on the site. Author SEO tools stay in Pages."
      capability: "Discoverable published content"
      mustSee: "Home insight cards, then Client experience. The spec does not require a Dentons SEO design."
      clickPath: ["/Home", "/Home/client-experience"]
      checkIn: "Is the published page enough for this score, or do you need metadata controls in Pages?"
    - id: m6
      title: "Analytics, measurement and optimization"
      wow: false
      cbi: [c6]
      audience: [a1]
      annoyance: "Authors and marketers need a native view of what the site is doing"
      afterward: "The homepage is the content that would be measured. The analytics screen is not on the public site."
      capability: "A native performance view for authors and marketers"
      mustSee: "Home. No analytics product screen is built. Say what would be measured and what needs external BI."
      clickPath: ["/Home"]
      checkIn: "Which numbers belong in the product, and which stay in your own reporting?"
    - id: m7
      title: "Personalization and experimentation"
      wow: false
      cbi: [c7]
      audience: [a1, a2]
      annoyance: "A business user needs to govern a personalized experience and its fallback"
      afterward: "Not built on this site. You asked at the start not to add personalization. The spec still scores it."
      capability: "Personalization and experimentation, as specified"
      mustSee: "Home, with no personalization rules. Confirm at approval if this scenario should be added."
      clickPath: ["/Home"]
      checkIn: "Should this scenario be added, or kept as a written response?"
  recap: "c1 authoring: Home and Global sectors, the published estate (m1). c2 DAM: homepage images only (m2). c3 AI content operations: Knowledge and one article, not the AI workflow (m3). c4 search: Our people, then Martin Abadi (m4). c5 SEO/AEO: Client experience (m5). c6 analytics: named against Home, not a product screen (m6). c7 personalization: not added, pending your confirmation against the spec (m7)."

site:
  collection: "Dentons"
  collectionMode: "new"
  template: "Empty"
  siteName: "Dentons"
  variantName: "Dentons"
  chrome:
    - feature: header-bar
      delivery: hardcoded-variant
      note: "Black 102px bar, logo and spacing from header-styles.json. Built by the header kit."
    - feature: main-navigation
      delivery: reuse
      component: Navigation
      note: "Four top-level items only: Global sectors, Global solutions, Client experience, Our people."
    - feature: language-pill
      delivery: hardcoded-variant
      fitReason: "English-only demo. The EN control is drawn in the header variant and does not switch language."
    - feature: header-search
      delivery: new
      fitReason: "The header has a search icon. No registry component is a search field."
      new:
        name: SiteSearch
        kind: context
        cms: false
        fields: []
        behaviour: "Search icon opens a keyword field. No AI-answer results page is added."
        placement: header-right
    - feature: hamburger-menu
      delivery: hardcoded-variant
      note: "Flyout links are hardcoded. Knowledge opens the mirrored insights page. The other flyout items are title stubs."
    - feature: personalization
      delivery: not-built
      fitReason: "Spec §4.1.7 scores personalization. The SE said not to add it at the start. Moment m7 asks them to confirm before any rules are built."
  pageTemplates:
    - id: person
      name: "Person Page"
      inheritsFrom: "Page"
      insertOn: "/Home/our-professionals"
      section: "Person Data"
      fields:
        - { name: Name, type: "Single-Line Text" }
        - { name: Role, type: "Single-Line Text" }
        - { name: Office, type: "Single-Line Text" }
        - { name: Photo, type: "Image" }
        - { name: Email, type: "General Link" }
        - { name: Phone, type: "Single-Line Text" }
        - { name: Bio, type: "Rich Text" }
        - { name: Experience, type: "Rich Text" }
        - { name: Recognition, type: "Rich Text" }
        - { name: Activities, type: "Rich Text" }
        - { name: Education, type: "Rich Text" }
        - { name: Languages, type: "Single-Line Text" }
      note: "Lawyer profiles under Our people are created from this template. It inherits Page and adds these fields. ProfessionalProfile reads them. Our people allows Person Page as an insert option."
  pages:
    - path: /Home
      displayName: "Home"
      pageType: page
      purpose: "Public homepage. Opens the spec scenarios that the live home page can show."
      proves: [m1, m2, m3, m6, m7]
      why: "Spec order starts here. The page mirrors https://www.dentons.com/en"
      sections:
        - { position: 1, component: hero-banner, fit: variant, fitReason: "Photo hero with a left headline and a pill button. The rotating slide uses the hero fields.", variant: Default, contentSource: site, liveSection: 2, note: "However you need to grow Dentons is here to help" }
        - { position: 2, component: four-column-cta, fit: variant, fitReason: "Four image tiles (Grow, Protect, Operate, Finance) sit in the same hero band.", variant: Default, look: Tiles, contentSource: site, liveSection: 2 }
        - { position: 3, component: three-column-cta, fit: variant, fitReason: "Image cards with an eyebrow, title, text and a purple pill button.", variant: Default, contentSource: site, liveSection: 3, note: "First row of insight cards" }
        - { position: 4, component: three-column-cta, fit: variant, fitReason: "Second row of the same card grid.", variant: Default, look: CardRow, contentSource: site, liveSection: 3 }
        - { position: 5, component: heading-cta, fit: variant, fitReason: "Section heading only, above the news cards.", variant: PageHeading, contentSource: site, liveSection: 4, note: "Dentons' news from around the world" }
        - { position: 6, component: three-column-cta, fit: variant, fitReason: "News cards, image on top, Read more pill.", variant: Default, look: News, contentSource: site, liveSection: 5 }
        - { position: 7, component: three-column-cta, fit: variant, fitReason: "Second news row, same card shape.", variant: Default, look: NewsRow, contentSource: site, liveSection: 5 }
        - { position: 8, component: heading-cta, fit: variant, fitReason: "A single Load more pill, not a full banner.", variant: Compact, contentSource: site, liveSection: 6, note: "Load more" }
        - { position: 9, component: cta-banner, fit: variant, fitReason: "Dark centered band with two text links, Contact us and find an office.", variant: Default, contentSource: site, liveSection: 7 }
    - path: /Home/our-professionals
      displayName: "Our people"
      pageType: page
      navGroup: main
      purpose: "People directory. The first screen of cards opens a lawyer profile."
      proves: [m4]
      why: "Spec §4.1.4. One click from Home. Its children are Person Page profiles. The click path opens Martin Abadi."
      liveUrl: "https://www.dentons.com/en/our-professionals"
      sectionsFile: "sections-our-professionals.json"
      sections:
        - position: 1
          component: professional-directory
          fit: new
          fitReason: "Keyword search, A-Z index, filters and a load-more people grid. No registry list searches or filters."
