story:
  situation: "Dentons is choosing the platform for dentons.com and the global estate before an RFP, and this session is the scored product demonstration. Shane in GBT needs a SaaS story he can trust on cost, and Carly, who owns content, needs to see publishing without a developer. The board's stated first priority is AI search, the scorecard's heaviest weight is authoring, and personalization must use on-platform signals rather than CRM."
  audiences:
    - id: a1
      name: "Carly, content owner"
      annoyance: "Routine updates still depend on a content team, and she wants drag-and-drop publishing without a developer"
      afterward: "She edits an insight on the page, previews desktop and mobile, and publishes it herself"
    - id: a2
      name: "Shane, GBT decision-maker"
      annoyance: "He is SaaS-first and still wary of Sitecore economics after a past case showed only about $200K of savings over five years"
      afterward: "He sees one SaaS license and an honest line between search that works today and conversational search that does not"
  chainOfPain:
    - id: c1
      name: "Publishing speed"
      issue: "Publishing an insight still depends on a content team and a long handoff"
      owners: [a1]
      reason: "Distributed authors and the current XP editing model. Carly asked for no-code publishing"
      evidence: "Wants easy content operations: drag-and-drop components, streamlined workflows, fast publishing."
      evidenceType: stated
      impact: "A 72-hour baseline is in the opportunity brief; the August deck labels similar figures illustrative. Confirm before quoting it"
    - id: c2
      name: "Trusted content ops"
      issue: "Content operations do not scale unless a person still reviews the draft"
      owners: [a1]
      reason: "Lawyers request practice-page updates, and agentic AI is a stated priority for cost and efficiency"
      evidence: "Lead with search, AI and content ops."
      evidenceType: stated
      impact: "not given"
    - id: c3
      name: "Expertise discovery"
      issue: "The board wants visitors to find lawyers, expertise, and offices through conversational search the product does not ship"
      owners: [a2]
      reason: "AI search is the global board's top stated priority, and Shane asked why it is not out of the box"
      evidence: "AI / RAG-style search — the global board's top priority."
      evidenceType: stated
      impact: "Search is about 10% of the scoring criteria. No business cost given"
    - id: c4
      name: "Discoverability"
      issue: "Content is not reliably discoverable by AI answer engines"
      owners: [a1]
      reason: "AEO is a stated priority, behind search and agentic AI"
      evidence: "AEO — making content discoverable by AI answer engines."
      evidenceType: stated
      impact: "not given"
    - id: c5
      name: "Anonymous relevance"
      issue: "The site cannot adapt to an anonymous visitor without a CRM project the firm does not want"
      owners: [a1, a2]
      reason: "They want location, visit, service line, and campaign signals, and they do not want CRM identity resolution"
      evidence: "They are less focused on building a unified customer view from CRM data."
      evidenceType: stated
      impact: "Ranked below search and AI. No metric given"
  messageMap:
    before: "dentons.com runs on Sitecore XP 10.4. Publishing waits on a content team, the board wants conversational search the product does not ship, and personalization must not become a CRM project."
    requiredCapabilities:
      - "A business user publishes an insight without a developer"
      - "A person still approves anything an agent drafts"
      - "Visitors find expertise with today's search, with a clear line around what is custom"
      - "Authors govern how a page is discovered"
      - "A marketer changes one block for an anonymous visitor from a page visit"
    after: "Shane sees a SaaS estate and an honest search story. Carly sees an insight she can edit and a homepage block that changes after a relevant visit."
    metrics:
      - "not given as business KPIs; the session is scored, with authoring at 25%"
    differentiators:
      - "SaaS, with CMS, CDP, personalization, search, Agentic Studio, and DAM in one license and AI included"
      - "Content and authoring skills stay in the Sitecore family"
    proofPoints:
      - "AmLaw-20 reference in the opportunity brief: about 85% accuracy over four months and about 200 hours a month, with human review. Not a Dentons result"
    whyNow: "Platform decision before the RFP. Client demo Friday. The other platform presents the following week."
  moments:
    - id: m1
      title: "Publish the insight"
      wow: true
      cbi: [c1, c2]
      audience: [a1, a2]
      annoyance: "An insight waits on the content team, and the image and the draft sit in that same queue"
      afterward: "She researches the topic, approves the draft and the channel, then reviews the page, adds the image, and a person publishes it"
      capability: "Research and drafting with a human at every step, then page review, the library image, and workflow publish"
      mustSee: "The live infrastructure article, then Market Signals, the approved draft, the approved website channel, the page builder edits, the library image, and the workflow approval"
      show: "The live article Structuring bankable infrastructure investment across Africa, with its headline, body, practice tags, and image, as a visitor sees the finished page"
      reveal: "Tell the path in this order, and keep a person on every step. Scenario 4.1.3 starts in Agentic Studio: a market signal on infrastructure is the research, she accepts it, and the draft is proposed for review before anything is saved. She can apply, skip, or decline. Metadata and a translation hold stay on that same review. The brand kit grounds the draft. The tool list is the audit. The Asana connector is partner customization and is not this path. She then approves the website as the channel. The agent can name other channels, and a person decides which ones are created. Scenario 4.1.1 is the page builder: she updates the draft, drags a component, checks desktop and mobile, and sets the practice tags. A role that cannot edit a locked shared field is the central governance. Scenario 4.1.2 is the image she adds there, from the library, included in the license. Publish goes through workflow. A person approves it. The agent does not publish. No code on screen."
      talkTrack: "Tell: today this page waits on a content team, for the research, the words, the image, and the review. Show: here it is, already live. Tell: a market signal started the research, she approved the draft and the website channel, then in the page builder she changed the copy, added the library image, and a person published it."
      clickPath:
        - /Home
        - "/Home/insights (click: Knowledge in the menu)"
        - "/Home/insights/structuring-bankable-infrastructure-investment-across-africa (click: Structuring bankable infrastructure investment across Africa)"
      checkIn: "Is this the publishing loop you want: research, approve the draft and the channel, then review the page and publish through a person?"
    - id: m2
      title: "Find the insight, then see why it can be cited"
      wow: false
      cbi: [c3, c4]
      audience: [a2, a1]
      annoyance: "The board wants a conversational answer the product does not ship, and thin pages get skipped by answer engines"
      afterward: "A visitor finds the insight with today's search, and the page's title, summary, and links are fields an author governs"
      capability: "Search and expertise discovery, then governed discoverability"
      mustSee: "Search results for infrastructure, then the article's title, summary, and related links, then search configuration and the metadata fields"
      show: "Search results for infrastructure, then the same article with its title, summary, and related links"
      reveal: "Tell the line, in spec order. Scenario 4.1.4: this is site search that is production-ready today. Generated or conversational answers are custom or roadmap, and Coveo may be named as the benchmark. Scenario 4.1.5: the metadata fields on that article. A GEO check can be a native agent skill. Scrunch is an add-on and is not in this site."
      talkTrack: "Tell: Shane asked why conversational search is not in the box, and Carly needs pages an answer engine can use. Show: a visitor searches infrastructure and opens this insight. Tell: that search is what ships today, and the title, summary, and links are fields her team governs."
      clickPath:
        - /Home
        - "/Home/search-results (search: infrastructure)"
        - "/Home/insights (click: Knowledge in the menu)"
        - "/Home/insights/structuring-bankable-infrastructure-investment-across-africa (click: Structuring bankable infrastructure investment across Africa)"
      checkIn: "Does this draw the right line between today's search and a generated answer, and are these the fields authors should own?"
    - id: m3
      title: "Measure the insight, then change the homepage"
      wow: false
      cbi: [c4, c5]
      audience: [a1, a2]
      annoyance: "Marketers cannot see whether an insight is working, and relevance would require a CRM feed they will not connect"
      afterward: "She sees this page's performance, then one homepage block follows the visit, with a test and a fallback"
      capability: "Analytics on the insight, then personalization and experimentation"
      mustSee: "The article, the author performance view, then the homepage block after the visit, the experiment, and the default fallback"
      show: "The infrastructure article a visitor just read, then the homepage, where the featured block now matches that topic and the default is still available"
      reveal: "Tell the two screens, in spec order. Scenario 4.1.6 first: the native author view of this article and of the infrastructure search. Enterprise reporting still needs external BI, and that is called out. Scenario 4.1.7 next: Pages, Personalize on the homepage block, the visit rule, an experiment on that block, and the default fallback. No CRM. The visit rule is told in the room. It is not created in this environment yet."
      talkTrack: "Tell: before we change the homepage, look at whether this insight is earning the visit. Show: they read it, and the homepage block followed, with the default still there. Tell: that performance view is the author screen, and the block is a visit rule she can test or turn off."
      trigger: "a visit to the infrastructure insight"
      clickPath:
        - /Home
        - "/Home/insights (click: Knowledge in the menu)"
        - "/Home/insights/structuring-bankable-infrastructure-investment-across-africa (click: the article)"
        - "/Home (click: the logo)"
      checkIn: "Is a visit to a practice topic a signal you would use, once you can see the page performing?"
  recap: "c1 Publishing speed and c2 Trusted content ops: loop 1 showed the live insight, then the market signal, the approved draft, the website channel, the page builder, the library image, and a person on the publish. c3 Expertise discovery and c4 Discoverability: loop 2 showed infrastructure search and the metadata on that article, with generated answers labeled custom or roadmap. c5 Anonymous relevance: loop 3 showed the author view of that page, then one homepage block after the visit, a test, and no CRM. The visit rule is not created in this environment yet."

