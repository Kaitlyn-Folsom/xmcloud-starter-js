        text: "Read more"
        href: "https://www.iflscience.com/a-new-longest-living-fish-sturgeon-could-top-400-years-far-longer-than-scientists-believed-but-something-indigenous-communities-had-long-understood-84308"
        target: "_blank"
      Title2: "The Conversation"
      Text2: "<p>Detroit wants to elevate youth voices in leadership – that means giving them real power: Krista Mehari, associate professor in the Department of Public Health at the College of Human Medicine, published an article about how the city of Detroit's effort to engage young people must mean they are included at the decision table.</p>"
      Link2:
        text: "Read more"
        href: "https://theconversation.com/detroit-wants-to-elevate-youth-voices-in-leadership-that-means-giving-them-real-power-284816"
        target: "_blank"
      Title3: "CBC News"
      Text3: "<p>Canadian workers speak out against growing screen time surveillance: Tara Behrend, a professor in the School of Human Resources and Labor Relations, explains her research on monitoring and surveillance tools when it comes to employee anxiety and productivity.</p>"
      Link3:
        text: "Read more"
        href: "https://www.cbc.ca/news/canada/td-bank-bell-workplace-screentime-monitoring-9.7296526"
        target: "_blank"
    children: []
