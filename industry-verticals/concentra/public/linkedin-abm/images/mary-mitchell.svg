<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200" role="img" aria-label="Mary Mitchell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ecf5"/>
      <stop offset="1" stop-color="#b9cde2"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4a32"/>
      <stop offset="1" stop-color="#4e2c1d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cdae"/>
      <stop offset="1" stop-color="#e6b38f"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22426b"/>
      <stop offset="1" stop-color="#162d4a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- soft office window light -->
  <rect x="128" y="0" width="72" height="200" fill="#ffffff" opacity="0.18"/>
  <!-- hair, back layer (shoulder length) -->
  <path d="M62 98 C57 58 82 36 102 36 C126 37 146 58 140 102 C138 122 144 134 138 146 L118 140 L118 112 L82 112 L82 140 L62 146 C56 132 63 118 62 98 Z" fill="url(#hair)"/>
  <!-- neck -->
  <path d="M87 112 L113 112 L115 146 L85 146 Z" fill="#e2ad88"/>
  <path d="M87 124 C95 131 105 131 113 124 L113 118 L87 118 Z" fill="#cf9a76" opacity="0.6"/>
  <!-- blazer -->
  <path d="M24 200 C28 166 52 150 86 143 L100 150 L114 143 C148 150 172 166 176 200 Z" fill="url(#blazer)"/>
  <!-- blouse -->
  <path d="M86 143 L100 182 L114 143 L100 150 Z" fill="#f6f2ec"/>
  <!-- lapels -->
  <path d="M86 143 L100 182 L92 200 L74 158 L80 146 Z" fill="#1a3657"/>
  <path d="M114 143 L100 182 L108 200 L126 158 L120 146 Z" fill="#1a3657"/>
  <!-- necklace -->
  <path d="M90 146 C95 158 105 158 110 146" fill="none" stroke="#d9c7a3" stroke-width="1.4"/>
  <circle cx="100" cy="157" r="2.2" fill="#e8d9b5"/>
  <!-- ears -->
  <ellipse cx="70" cy="90" rx="5" ry="8" fill="#e6b38f"/>
  <ellipse cx="130" cy="90" rx="5" ry="8" fill="#e6b38f"/>
  <circle cx="70" cy="100" r="2.2" fill="#f4efe6"/>
  <circle cx="130" cy="100" r="2.2" fill="#f4efe6"/>
  <!-- face -->
  <ellipse cx="100" cy="86" rx="30" ry="36" fill="url(#skin)"/>
  <!-- hair, front sweep -->
  <path d="M69 88 C66 56 88 44 104 46 C126 48 136 64 132 90 C127 72 116 62 100 63 C88 64 78 72 74 82 C72 86 70 88 69 88 Z" fill="url(#hair)"/>
  <path d="M100 63 C110 60 122 64 128 74" fill="none" stroke="#9a6447" stroke-width="1.5" opacity="0.7"/>
  <!-- brows -->
  <path d="M82 79 C86 76 92 76 95 78" fill="none" stroke="#5a3424" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M105 78 C108 76 114 76 118 79" fill="none" stroke="#5a3424" stroke-width="2.2" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="89" cy="87" rx="3.6" ry="2.6" fill="#ffffff"/>
  <ellipse cx="111" cy="87" rx="3.6" ry="2.6" fill="#ffffff"/>
  <circle cx="89" cy="87" r="2.1" fill="#3d2a1f"/>
  <circle cx="111" cy="87" r="2.1" fill="#3d2a1f"/>
  <circle cx="89.7" cy="86.3" r="0.6" fill="#fff"/>
  <circle cx="111.7" cy="86.3" r="0.6" fill="#fff"/>
  <path d="M84.5 85 C87 83.4 91 83.4 93.5 85" fill="none" stroke="#3d2a1f" stroke-width="1.1"/>
  <path d="M106.5 85 C109 83.4 113 83.4 115.5 85" fill="none" stroke="#3d2a1f" stroke-width="1.1"/>
  <!-- smile lines -->
  <path d="M84 91 C86 92.5 88 92.8 90 92.6" fill="none" stroke="#d29e7c" stroke-width="0.8"/>
  <path d="M116 91 C114 92.5 112 92.8 110 92.6" fill="none" stroke="#d29e7c" stroke-width="0.8"/>
  <!-- nose -->
  <path d="M100 90 C99 96 97 100 98 102 C99 103.5 102 103.5 103 102" fill="none" stroke="#c98e6b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="84" cy="99" rx="6" ry="3.5" fill="#e79a86" opacity="0.35"/>
  <ellipse cx="116" cy="99" rx="6" ry="3.5" fill="#e79a86" opacity="0.35"/>
  <!-- smile -->
  <path d="M89 108 C95 114.5 105 114.5 111 108 C105 110.5 95 110.5 89 108 Z" fill="#b5475a"/>
  <path d="M91 108.6 C96 111.6 104 111.6 109 108.6" fill="#ffffff" opacity="0.9"/>
</svg>
